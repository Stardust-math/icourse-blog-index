name: Update dataset

on:
  schedule:
    - cron: "37 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: icourse-crawler
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ICOURSE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out the current default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install crawler
        run: python -m pip install .

      - name: Check initialization state
        id: state
        shell: bash
        run: |
          ready="$(python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("data/manifest.json").read_text(encoding="utf-8"))
          state = json.loads(Path("state/crawler.json").read_text(encoding="utf-8"))
          status = str(manifest.get("initialization_status", ""))
          phase = str(state.get("phase", ""))
          print(
              "true"
              if status in {"complete", "completed"} and phase == "maintenance"
              else "false"
          )
          PY
          )"
          echo "ready=${ready}" >> "$GITHUB_OUTPUT"
          if [[ "$ready" != "true" ]]; then
            echo "Initialization is not complete; daily maintenance will not run yet."
          fi

      - name: Update profiles and blog health
        if: steps.state.outputs.ready == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          set +e
          python -m icourse_blog_index update --time-budget-seconds 7200
          update_exit="$?"
          set -e

          if (( update_exit != 0 && update_exit != 3 )); then
            echo "Profile update failed with exit code ${update_exit}."
            exit "$update_exit"
          fi

          if (( update_exit == 0 )); then
            set +e
            python -m icourse_blog_index check-links \
              --max-links 200 \
              --time-budget-seconds 7200
            links_exit="$?"
            set -e
            if (( links_exit != 0 && links_exit != 3 )); then
              echo "Link check failed with exit code ${links_exit}."
              exit "$links_exit"
            fi
          else
            echo "Profile crawler requested a safety pause; skipping external-link checks."
          fi

          python -m icourse_blog_index render
          python -m icourse_blog_index validate

          if (( update_exit == 3 )); then
            echo "The validated safety-pause checkpoint will now be committed."
          fi

      - name: Commit updated data
        if: steps.state.outputs.ready == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data state

          if git diff --cached --quiet; then
            echo "No dataset changes to commit."
            exit 0
          fi

          git commit -m "data: scheduled update [skip ci]"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:${DEFAULT_BRANCH}"
