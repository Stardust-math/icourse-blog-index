name: Bootstrap chunk

on:
  workflow_call:
    inputs:
      chunk_number:
        description: Position of this serial chunk in the bootstrap workflow
        required: true
        type: number
    outputs:
      should_continue:
        description: Whether another serial bootstrap chunk is still needed
        value: ${{ jobs.crawl.outputs.should_continue }}

permissions:
  contents: write

jobs:
  crawl:
    name: Chunk ${{ inputs.chunk_number }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      should_continue: ${{ steps.continuation.outputs.should_continue }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CHUNK_NUMBER: ${{ inputs.chunk_number }}
      ICOURSE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out the current default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install crawler
        run: python -m pip install .

      - name: Configure checkpoint commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Crawl and push recoverable checkpoints
        shell: bash
        run: |
          set -Eeuo pipefail

          read_bootstrap_state() {
            python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("data/manifest.json").read_text(encoding="utf-8"))
          state = json.loads(Path("state/crawler.json").read_text(encoding="utf-8"))
          status = str(manifest.get("initialization_status", ""))
          phase = str(state.get("phase", ""))

          if status == "blocked" or phase == "blocked":
              print("blocked")
          elif status == "paused" or phase == "paused":
              print("paused")
          elif status in {"complete", "completed"} and phase == "maintenance":
              print("complete")
          else:
              print("continue")
          PY
          }

          started_at="$(date +%s)"

          for slice_number in $(seq 1 16); do
            bootstrap_state="$(read_bootstrap_state)"
            if [[ "$bootstrap_state" == "complete" ]]; then
              echo "Bootstrap is already complete; no more source requests are needed."
              break
            fi
            if [[ "$bootstrap_state" == "blocked" ]]; then
              echo "Bootstrap is blocked by a safety condition; stopping without retrying."
              break
            fi
            if [[ "$bootstrap_state" == "paused" ]]; then
              echo "Bootstrap is safety-paused. Investigate the run, then use the explicit resume workflow option."
              break
            fi

            now="$(date +%s)"
            elapsed="$((now - started_at))"
            remaining="$((17100 - elapsed))"
            if (( remaining < 300 )); then
              echo "The 285-minute application budget is exhausted; the next job will resume."
              break
            fi

            slice_budget=1200
            if (( remaining < slice_budget )); then
              slice_budget="$remaining"
            fi

            echo "Starting chunk ${CHUNK_NUMBER}, checkpoint slice ${slice_number}/16."
            set +e
            python -m icourse_blog_index bootstrap-chunk \
              --max-ids 250 \
              --time-budget-seconds "$slice_budget"
            crawl_exit="$?"
            set -e

            if (( crawl_exit != 0 && crawl_exit != 3 )); then
              echo "Crawler failed with exit code ${crawl_exit}; refusing to commit unvalidated data."
              exit "$crawl_exit"
            fi

            python -m icourse_blog_index render
            python -m icourse_blog_index validate

            git add README.md data state
            if git diff --cached --quiet; then
              echo "No data changed in this slice."
            else
              git commit -m \
                "data: bootstrap checkpoint ${CHUNK_NUMBER}.${slice_number} [skip ci]"
              git pull --rebase origin "$DEFAULT_BRANCH"
              git push origin "HEAD:${DEFAULT_BRANCH}"
            fi

            if (( crawl_exit == 3 )); then
              echo "Crawler requested a safety pause; its validated pause checkpoint was pushed."
              break
            fi

            post_slice_state="$(read_bootstrap_state)"
            if [[ "$post_slice_state" == "paused" || "$post_slice_state" == "blocked" ]]; then
              echo "A safety condition remains after this slice; no automatic retry will be made."
              break
            fi
          done

      - name: Decide whether another chunk is needed
        id: continuation
        shell: bash
        run: |
          should_continue="$(python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("data/manifest.json").read_text(encoding="utf-8"))
          state = json.loads(Path("state/crawler.json").read_text(encoding="utf-8"))
          status = str(manifest.get("initialization_status", ""))
          phase = str(state.get("phase", ""))
          stopped = (
              status in {"blocked", "complete", "completed", "paused"}
              or phase in {"blocked", "maintenance", "paused"}
          )
          print("false" if stopped else "true")
          PY
          )"
          echo "should_continue=${should_continue}" >> "$GITHUB_OUTPUT"
          echo "Another serial bootstrap chunk needed: ${should_continue}"
